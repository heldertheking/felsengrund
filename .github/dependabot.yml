version: 2
updates:
  # One configuration for the whole npm workspace (one root lockfile). Every minor and patch update lands in a
  # single PR, so a week produces at most one PR here instead of one per package and per workspace.
  #
  # Only the root directory is listed on purpose: Dependabot updates the manifest of every workspace from there (one
  # PR touches apps/*, packages/* and e2e together). Listing the workspaces as extra directories made it open the same
  # update once per workspace.
  #
  # Security updates are separate: Dependabot opens them as soon as an advisory exists, regardless of the grouping
  # and the ignore rule below.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 2
    labels:
      - 'dependencies'
    groups:
      npm-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Major versions are migrations (React 19 stack, TypeScript 7, Vitest 5, ...). They are reviewed together in
      # one ticket a few times a year instead of arriving as a PR per package and workspace; see issue #84 and
      # docs/dependencies.md.
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'

  # GitHub Actions used by the workflows: one PR a month for all of them.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    labels:
      - 'dependencies'
    groups:
      github-actions:
        patterns:
          - '*'
