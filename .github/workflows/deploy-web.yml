name: Deploy web to webkeeper.ch

on:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'packages/types/**'
      - 'packages/logger/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required build vars
        env:
          VARS_JSON: ${{ toJson(vars) }}
        run: |
          # List required variable names separated by spaces or newlines:
          REQUIRED_VARS="
            PUBLIC_API_BASE_URL
            GOOGLE_CALENDAR_EMBED_URL
          "

          FAILED=0
          for VAR_NAME in $REQUIRED_VARS; do
            VALUE=$(echo "$VARS_JSON" | jq -r --arg key "$VAR_NAME" '.[$key] // empty')
            if [ -z "$VALUE" ]; then
              echo "::error::${VAR_NAME} repo variable is not set (Settings -> Secrets and variables -> Actions -> Variables). The build would silently bake in an empty value, breaking production functionality."
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

      - name: Build Webapp
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          GOOGLE_CALENDAR_EMBED_URL: ${{ vars.GOOGLE_CALENDAR_EMBED_URL }}
        run: npm run build -w @felsengrund/web

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro-dist
          path: apps/web/dist/
          # actions/upload-artifact@v4 silently drops dotfiles (.htaccess included) unless told
          # otherwise — without this, .htaccess never reaches the deployment job at all, every time,
          # regardless of how the FTP step itself behaves.
          include-hidden-files: true

  deploy:
    name: Deploy Output via FTP
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: astro-dist
          path: ./dist

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
